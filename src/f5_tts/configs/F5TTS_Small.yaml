hydra:
  run:
    dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: Emilia_ZH_EN
  batch_size_per_gpu: 38400  # 8 GPUs, 8 * 38400 = 307200
  batch_size_type: frame  # frame | sample
  max_samples: 64  # max sequences per batch if use frame-wise batch_size. we set 32 for small models, 64 for base models
  num_workers: 16

optim:
  epochs: 11  # only suitable for Emilia, if you want to train it on LibriTTS, set epoch 686
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 1  # note: updates = steps / grad_accumulation_steps
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not
  global_masked_mean: False  # opt-in: equal-weight every masked frame across accumulation/DDP (default preserves per-microbatch mean)
  # Opt-in cap on the PADDED batch rectangle (batch_size * max_frames), used when
  # datasets.batch_size_type=frame. datasets.batch_size_per_gpu budgets the SUM of raw frame
  # lengths; the tensor actually allocated is the padded rectangle. Measured worst-case
  # overshoot at N=100k: 1.00x for LibriSpeech-/Emilia-shaped
  # and uniform corpora, but 1.82x for bimodal ones (short prompts mixed with long-form audio).
  #   0                      -> off, batch composition identical to upstream (DEFAULT)
  #   = datasets.batch_size_per_gpu -> recommended if enabling: bounds the rectangle to the
  #                             budget you already set, costs <=0.06% more batches, drops no
  #                             samples, leaves total padded frames (throughput) unchanged
  #   > datasets.batch_size_per_gpu -> deliberate slack; only matters on bimodal data
  #   < datasets.batch_size_per_gpu -> not recommended: shrinks every batch, can discard samples
  # Unrelated to torch.compile - compiled runs measured ~12% LOWER peak VRAM than eager, so
  # enable this based on your corpus shape, not on whether compile is on.
  max_padded_frames: 0

model:
  name: F5TTS_Small
  tokenizer: pinyin
  tokenizer_path: null  # if 'custom' tokenizer, define the path want to use (should be vocab.txt)
  backbone: DiT
  arch:
    dim: 768
    depth: 18
    heads: 12
    ff_mult: 2
    text_dim: 512
    text_mask_padding: False
    conv_layers: 4
    pe_attn_head: 1
    attn_backend: torch  # torch | flash_attn
    attn_mask_enabled: False
    checkpoint_activations: False  # recompute activations and save memory for extra compute
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos  # vocos | bigvgan
  vocoder:
    is_local: False  # use local offline ckpt or not
    local_path: null  # local vocoder path

ckpts:
  logger: wandb  # wandb | tensorboard | null
  wandb_project: CFM-TTS  # wandb project name
  wandb_run_name: ${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}  # wandb run name
  wandb_resume_id: null  # wandb run id for resuming, null to auto-detect from checkpoint
  log_samples: True  # infer random sample per save checkpoint. wip, normal to fail with extra long samples
  save_per_updates: 50000  # save checkpoint per updates
  keep_last_n_checkpoints: -1  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 5000  # save last checkpoint per updates
  save_dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}

compile:
  enabled: False  # optional torch.compile path; disabled by default
  target: dit_blocks  # dit_blocks | cfm_loss_core
  # dit_blocks compiles each DiT block (training only); cfm_loss_core compiles the whole
  # loss core. Measured on variable-length data: dit_blocks pays ~40% less cold compile and
  # reaches a similar steady state, so it amortizes far sooner. cfm_loss_core covers 100% of
  # parameters and edges ahead on steady-state throughput once warm, so prefer it only for
  # very long runs. Both were ~1.1x eager steady-state with ~12% lower peak VRAM.
  backend: inductor  # requires triton on CUDA
  mode: null  # e.g. default, reduce-overhead, max-autotune (reduce-overhead/max-autotune need fixed shapes)
  fullgraph: False  # NOTE: with fullgraph the recompile limit is a HARD error, not a fall back to eager
  dynamic: null  # null lets Dynamo auto-promote varying dims after the 2nd distinct value;
  # True compiles one symbolic graph up front, which halves recompiles and cold-compile time.
  # False specializes per shape and is catastrophic for variable-length training.
  fallback_to_eager: True  # fall back to eager if compile setup fails (runtime fallback disabled in DDP)
  # Reproducibility note: with dropout > 0 (the default), Inductor uses its own RNG, so
  # compiled dropout masks differ from eager. This is expected and statistically harmless.
  # For eager-identical dropout, pass options={"fallback_random": True} to torch.compile.
