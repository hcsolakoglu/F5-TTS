name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-gloo:
    name: Python ${{ matrix.python }} / Torch ${{ matrix.torch }} / Accelerate ${{ matrix.accelerate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.0.1"
            accelerate: "0.33.0"
          - python: "3.12"
            torch: "2.5.1"
            accelerate: "1.14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "accelerate==${{ matrix.accelerate }}" \
            datasets \
            ema-pytorch \
            librosa \
            pypinyin \
            rjieba \
            pytest \
            ruff \
            torchdiffeq \
            wandb \
            x-transformers
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check src tests
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: CPU and Gloo regression suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
